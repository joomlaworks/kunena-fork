PLG_KUNENA_BALDRICK = "Kunena - Baldrick AI"
PLG_KUNENA_BALDRICK_XML_DESCRIPTION = "Baldrick, the forum's AI first responder: replies to new threads and to threads revived after a long silence when no administrator or moderator has answered, using Anthropic or OpenAI-compatible APIs. <strong>Privacy:</strong> the text of the threads it handles (and of related public threads) is sent to the AI provider you configure; mention this in your privacy policy. Activity, totals and costs: Kunena &gt; Baldrick AI."

PLG_KUNENA_BALDRICK_SECTION_TRIAGE = "Step 1: triage model (small, cheap)"
PLG_KUNENA_BALDRICK_SECTION_TRIAGE_DESC = "Reads every new question first: rates it (answerable, too broad, missing details, not a question, spam) and writes the search queries for related threads. A small, fast model is enough."
PLG_KUNENA_BALDRICK_SECTION_ANSWER = "Step 2: answer model (more capable)"
PLG_KUNENA_BALDRICK_SECTION_ANSWER_DESC = "Writes the answer to clear questions, using the thread and the related public threads found in the forum. It can use the connection of step 1 with another model, or a connection of its own."
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR = "When Baldrick replies"
PLG_KUNENA_BALDRICK_SECTION_BEHAVIOUR_DESC = "Baldrick looks at every new thread, at the thread starter's replies to Baldrick (a conversation), and at replies to threads that were silent for longer than the number of days below. It never replies when the last post comes from an administrator or moderator."
PLG_KUNENA_BALDRICK_SECTION_REPLIES = "How Baldrick replies"
PLG_KUNENA_BALDRICK_SECTION_REPLIES_DESC = "Replies are published immediately as Baldrick's user, in forum BBCode. Links to forum threads are relative."
PLG_KUNENA_BALDRICK_SECTION_SPAM = "Spam"
PLG_KUNENA_BALDRICK_SECTION_SPAM_DESC = "When the triage model is confident that a post is spam (advertising, phone numbers, SEO links...), Baldrick unpublishes it: a whole thread when it is the first post. Unpublished posts wait for moderation, so a mistake is undone by approving them."
PLG_KUNENA_BALDRICK_SECTION_NOTIFY = "Notifications"
PLG_KUNENA_BALDRICK_SECTION_NOTIFY_DESC = "A plain-text e-mail is sent through Joomla's mail settings, with the first post of the thread and its last 5 posts, newest first. Spam actions and errors (a thread Baldrick gave up on, a pause because the AI provider refuses its requests) are always notified. The result of each e-mail is shown in the activity log."

PLG_KUNENA_BALDRICK_PROVIDER = "API type"
PLG_KUNENA_BALDRICK_PROVIDER_DESC = "Anthropic Messages API (Claude, and Anthropic-compatible endpoints such as Qwen's), or OpenAI-compatible Chat Completions (OpenAI, Qwen/DashScope, OpenRouter, DeepSeek, Ollama, vLLM...)."
PLG_KUNENA_BALDRICK_PROVIDER_ANTHROPIC = "Anthropic-compatible (Messages API)"
PLG_KUNENA_BALDRICK_PROVIDER_OPENAI = "OpenAI-compatible (Chat Completions)"
PLG_KUNENA_BALDRICK_BASE_URL = "Base URL"
PLG_KUNENA_BALDRICK_BASE_URL_DESC = "Leave empty for the official API (https://api.anthropic.com or https://api.openai.com/v1). Examples for Qwen Cloud: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic (Anthropic-compatible) or https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1 (OpenAI-compatible)."
PLG_KUNENA_BALDRICK_BASE_URL_HINT = "Empty: the official API"
PLG_KUNENA_BALDRICK_API_KEY = "API key"
PLG_KUNENA_BALDRICK_API_KEY_DESC = "The provider's API key. Baldrick does nothing until a key and the models are set."
PLG_KUNENA_BALDRICK_MODEL = "Model"
PLG_KUNENA_BALDRICK_TRIAGE_MODEL_DESC = "Model of the triage step, e.g. claude-haiku-5-5. &quot;Fetch models&quot; lists the models of the provider with the values above (saved or not) in a searchable list (kept for an hour; &quot;Refresh&quot; asks again); you can also type a name. &quot;Test&quot; sends a tiny request to the model."
PLG_KUNENA_BALDRICK_ANSWER_MODEL_DESC = "Model of the answer step, e.g. claude-sonnet-5-5 (or claude-opus-5-5 for the best answers). &quot;Fetch models&quot; lists the models of the provider; you can also type a name. &quot;Test&quot; sends a tiny request to the model."
PLG_KUNENA_BALDRICK_FETCH_MODELS = "Fetch models"
PLG_KUNENA_BALDRICK_TEST = "Test"
PLG_KUNENA_BALDRICK_WORKING = "Working..."
PLG_KUNENA_BALDRICK_CHOOSE_MODEL = "- Choose a model -"
PLG_KUNENA_BALDRICK_REQUEST_FAILED = "The request failed."
PLG_KUNENA_BALDRICK_PRICE_IN = "Price: input"
PLG_KUNENA_BALDRICK_PRICE_OUT = "Price: output"
PLG_KUNENA_BALDRICK_PRICE_DESC = "USD per million tokens, for the cost estimates. Empty: the list price for known Claude models, otherwise 0 (unless the provider reports the cost itself)."
PLG_KUNENA_BALDRICK_SAME_CONNECTION = "Use the connection of step 1"
PLG_KUNENA_BALDRICK_SAME_CONNECTION_DESC = "Use the same API type, base URL and key as the triage step (with the model chosen below). Choose No to use another provider for the answers."
PLG_KUNENA_BALDRICK_FALLBACKS = "Anthropic: fallback on refusals"
PLG_KUNENA_BALDRICK_FALLBACKS_DESC = "Only on Anthropic's own API with Opus/Sonnet 5.x models: when the model's safety checks decline a request, the API runs it again on a fallback model chosen by Anthropic (server-side fallbacks). Not available for Haiku."

PLG_KUNENA_BALDRICK_DRY_RUN = "Dry run"
PLG_KUNENA_BALDRICK_DRY_RUN_DESC = "For testing the configuration: Baldrick only replies in threads started by administrators and moderators (new threads, and their follow-ups to Baldrick), and never unpublishes posts (spam is only reported)."
PLG_KUNENA_BALDRICK_USER = "Baldrick's user"
PLG_KUNENA_BALDRICK_USER_DESC = "The user Baldrick posts as. Leave empty to have a user &quot;Baldrick&quot; created automatically (no usable password, no real e-mail address). Set its avatar and signature in its forum profile (a new user gets the signature &quot;Replied by Baldrick AI, my lord, using a cunning model (...and do remember that AI can make mistakes, so double check responses)&quot;)."
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS = "Revive after (days)"
PLG_KUNENA_BALDRICK_INACTIVITY_DAYS_DESC = "A reply to a thread whose previous post is older than this is handled like a new question."
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC = "Replies per thread"
PLG_KUNENA_BALDRICK_REPLIES_PER_TOPIC_DESC = "How many times Baldrick may reply in the same thread: its first reply, and its answers when the thread's starter replies to it (details it asked for, a further question) or the thread is revived after a long silence."
PLG_KUNENA_BALDRICK_DAILY_CAP = "Replies per day"
PLG_KUNENA_BALDRICK_DAILY_CAP_DESC = "At most this many replies in 24 hours (0: no limit). Protects your API budget from floods."
PLG_KUNENA_BALDRICK_MIN_LENGTH = "Minimum post length"
PLG_KUNENA_BALDRICK_MIN_LENGTH_DESC = "Posts shorter than this (characters, without formatting) are ignored."
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE = "Only these categories"
PLG_KUNENA_BALDRICK_CATEGORIES_INCLUDE_DESC = "Reply only in these categories (none selected: all categories)."
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE = "Never in these categories"
PLG_KUNENA_BALDRICK_CATEGORIES_EXCLUDE_DESC = "Never reply in these categories."
PLG_KUNENA_BALDRICK_PUBLIC_ONLY = "Public categories only"
PLG_KUNENA_BALDRICK_PUBLIC_ONLY_DESC = "Reply only in categories guests can read, so that no private content is sent to the AI provider. Related threads are always taken from public categories only."

PLG_KUNENA_BALDRICK_TRANSLATE = "Add an English translation"
PLG_KUNENA_BALDRICK_TRANSLATE_DESC = "Baldrick replies in the poster's language. With this option, replies in other languages are followed by an English translation (useful for an English-speaking staff and readers)."
PLG_KUNENA_BALDRICK_RETRIEVAL = "Related threads"
PLG_KUNENA_BALDRICK_RETRIEVAL_DESC = "How many related public threads (found with the triage step's search queries) are given to the answer model."
PLG_KUNENA_BALDRICK_PRESET = "Built-in master prompt"
PLG_KUNENA_BALDRICK_PRESET_DESC = "The instructions every answer starts from (read only). Your site context below is added to them."
PLG_KUNENA_BALDRICK_SITE_CONTEXT = "Site context"
PLG_KUNENA_BALDRICK_SITE_CONTEXT_DESC = "What the forum is about, products and versions supported, links to documentation, the tone to use, what Baldrick must never do... Added to the prompts of both steps (it also helps the triage model tell spam from on-topic posts)."
PLG_KUNENA_BALDRICK_SITE_CONTEXT_HINT = "e.g. This is the support forum of ExampleSoft. We support versions 3 and 4. The documentation is at https://docs.example.com. Never promise refunds."
PLG_KUNENA_BALDRICK_CANNED = "Canned replies"
PLG_KUNENA_BALDRICK_CANNED_DESC = "Replies to questions that are too broad (no AI answer is written), and fallbacks when no answer can be written. Separate replies with a line of three dashes (---); one is picked at random. Placeholders: {name} (the poster), {search_url} (forum search for the question), {forum_url}, {topic_url}. Forum BBCode is allowed."

PLG_KUNENA_BALDRICK_SPAM_ACTION = "Spam"
PLG_KUNENA_BALDRICK_SPAM_ACTION_DESC = "What to do when the triage model is confident a post is spam. An e-mail is sent in both first cases."
PLG_KUNENA_BALDRICK_SPAM_UNPUBLISH = "Unpublish (the whole thread for a first post) and notify"
PLG_KUNENA_BALDRICK_SPAM_REPORT = "Only notify"
PLG_KUNENA_BALDRICK_SPAM_IGNORE = "Ignore"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED = "Trusted after (posts)"
PLG_KUNENA_BALDRICK_SPAM_TRUSTED_DESC = "Posts of users with at least this many published posts, and of the staff, are never unpublished: they are only reported."

PLG_KUNENA_BALDRICK_NOTIFY_USERS = "Notify these staff members"
PLG_KUNENA_BALDRICK_NOTIFY_USERS_DESC = "Super Users, Kunena administrators and moderators who receive the notifications (Ctrl/Cmd+click to choose several)."
PLG_KUNENA_BALDRICK_NOTIFY_ON = "Notify about"
PLG_KUNENA_BALDRICK_NOTIFY_ON_DESC = "Every reply Baldrick posts (answers, canned replies, requests for details) and spam, or spam only. Errors are always notified."
PLG_KUNENA_BALDRICK_NOTIFY_ON_ALL = "Every reply, spam and errors"
PLG_KUNENA_BALDRICK_NOTIFY_ON_SPAM = "Spam and errors only"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS = "Notify these addresses"
PLG_KUNENA_BALDRICK_NOTIFY_EMAILS_DESC = "More e-mail addresses, separated by commas."

PLG_KUNENA_BALDRICK_PROCESSING = "Processing"
PLG_KUNENA_BALDRICK_PROCESSING_DESC = "Automatic: right after the page that queued a thread has been sent (with PHP-FPM), or by a background request to the site itself. Command line only: run &quot;php cli/joomla.php kunena:baldrick:process&quot; from cron (Joomla 3.x UTD), e.g. every minute."
PLG_KUNENA_BALDRICK_PROCESSING_AUTO = "Automatic"
PLG_KUNENA_BALDRICK_PROCESSING_CRON = "Command line only (cron)"
PLG_KUNENA_BALDRICK_LOG_DAYS = "Keep the activity log (days)"
PLG_KUNENA_BALDRICK_LOG_DAYS_DESC = "Rows of the activity log older than this are deleted. Monthly totals are kept for 36 months."

PLG_KUNENA_BALDRICK_SECTION_ADVANCED = "Advanced: processing, limits and timeouts"
PLG_KUNENA_BALDRICK_SECTION_ADVANCED_DESC = "Posting never waits for the AI: threads are queued and processed in the background. Network errors, rate limits and overloaded providers are retried (as soon as the provider allows), then the thread is tried again later (3 attempts). Errors of the account (invalid key, no credits, unknown model) pause Baldrick and notify the recipients above."
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT = "Connection timeout (seconds)"
PLG_KUNENA_BALDRICK_CONNECT_TIMEOUT_DESC = "How long to wait for the provider to accept the connection. Short, so that network problems show quickly."
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT = "Triage response timeout (seconds)"
PLG_KUNENA_BALDRICK_TRIAGE_TIMEOUT_DESC = "How long to wait for the triage model's complete answer (it is short)."
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT = "Answer response timeout (seconds)"
PLG_KUNENA_BALDRICK_ANSWER_TIMEOUT_DESC = "How long to wait for the answer model's complete answer. Answers are not streamed: this covers writing the whole reply, and models that think first may need a minute or more."
PLG_KUNENA_BALDRICK_TRIAGE_MAX_TOKENS = "Triage max tokens"
PLG_KUNENA_BALDRICK_ANSWER_MAX_TOKENS = "Answer max tokens"
PLG_KUNENA_BALDRICK_MAX_TOKENS_DESC = "Upper limit of the model's output (including its thinking, for models that think). Raise it if answers are cut off."
PLG_KUNENA_BALDRICK_MAX_WAIT = "Maximum wait in the queue (hours)"
PLG_KUNENA_BALDRICK_MAX_WAIT_DESC = "Threads still waiting after this long (e.g. after an outage of the provider) are skipped: a reply days later would be odd. 0: no limit."
PLG_KUNENA_BALDRICK_PAUSE_MINUTES = "Pause after account errors (minutes)"
PLG_KUNENA_BALDRICK_PAUSE_MINUTES_DESC = "After an invalid key, exhausted credits or quota, or an unknown model, Baldrick pauses (queued threads wait), e-mails the notification recipients once, and tries again after this many minutes until the provider answers. Saving these settings ends the pause."
PLG_KUNENA_BALDRICK_REFRESH_MODELS = "Refresh"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS = "Show all models"
PLG_KUNENA_BALDRICK_SHOW_ALL_MODELS_DESC = "Include models that can't write chat answers (embeddings, speech, images...)"
PLG_KUNENA_BALDRICK_SEARCH_MODELS = "Type to search the models"
PLG_KUNENA_BALDRICK_NO_MODEL_MATCH = "No model matches"
PLG_KUNENA_BALDRICK_PRICES_FILLED = "Prices filled in from the provider's list."
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS = "Plain search: latest posts searched"
PLG_KUNENA_BALDRICK_RETRIEVAL_MAX_POSTS_DESC = "Without a full-text index (SQLite, or before you create it in Kunena > Baldrick AI) related threads are found by reading the posts, about 2.5 seconds per 50,000 posts: only this many of the latest posts are searched (0: all). With the index, every post is searched."
